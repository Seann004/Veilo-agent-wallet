# LiteSVM tests for the privacy-pool program with real Groth16 proofs. A separate workspace so
# neither Anchor nor the main workspace build it; run via programs/privacy-pool/scripts/test.sh.
[package]
name = "privacy-pool-litesvm"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
litesvm = "=0.17.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-message = "4.2.4"
solana-transaction = { version = "4.1.5", features = ["serde"] }
solana-transaction-error = "3"
solana-instruction = "3.5"
solana-instruction-error = "2"
solana-address = { version = "2.7", features = ["curve25519"] }
solana-account = "4"
solana-compute-budget-interface = "3"
bincode = "1.3"
sha2 = "0.10"
serde_json = "1"
